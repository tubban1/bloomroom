<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#ECE7DA"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DF7B8B"/>
      <stop offset="100%" stop-color="#C7596B"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78846C"/>
      <stop offset="100%" stop-color="#5D6752"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4CF58"/>
      <stop offset="100%" stop-color="#DDA32E"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2B2822" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#191914" stroke-width="12" filter="url(#softShadow)"/>
  
  <!-- Subtle inner border line -->
  <rect x="54" y="54" width="404" height="404" rx="92" fill="none" stroke="rgba(25, 25, 20, 0.08)" stroke-width="2"/>

  <!-- Leaves behind bloom -->
  <path d="M256 256 C290 320 370 340 375 330 C380 320 350 240 256 256 Z" fill="url(#leafGrad)" opacity="0.95" stroke="#191914" stroke-width="6" stroke-linejoin="round"/>
  <path d="M256 256 C222 320 142 340 137 330 C132 320 162 240 256 256 Z" fill="url(#leafGrad)" opacity="0.95" stroke="#191914" stroke-width="6" stroke-linejoin="round"/>

  <!-- 6 Symmetrical Petals -->
  <!-- Top Petal -->
  <path d="M256 256 C215 150 297 150 256 256 Z" transform="rotate(0 256 256) translate(0, -60)" fill="url(#petalGrad)" stroke="#191914" stroke-width="7" stroke-linejoin="round"/>
  <!-- Petal 60deg -->
  <path d="M256 256 C215 150 297 150 256 256 Z" transform="rotate(60 256 256) translate(0, -60)" fill="url(#petalGrad)" stroke="#191914" stroke-width="7" stroke-linejoin="round"/>
  <!-- Petal 120deg -->
  <path d="M256 256 C215 150 297 150 256 256 Z" transform="rotate(120 256 256) translate(0, -60)" fill="url(#petalGrad)" stroke="#191914" stroke-width="7" stroke-linejoin="round"/>
  <!-- Petal 180deg -->
  <path d="M256 256 C215 150 297 150 256 256 Z" transform="rotate(180 256 256) translate(0, -60)" fill="url(#petalGrad)" stroke="#191914" stroke-width="7" stroke-linejoin="round"/>
  <!-- Petal 240deg -->
  <path d="M256 256 C215 150 297 150 256 256 Z" transform="rotate(240 256 256) translate(0, -60)" fill="url(#petalGrad)" stroke="#191914" stroke-width="7" stroke-linejoin="round"/>
  <!-- Petal 300deg -->
  <path d="M256 256 C215 150 297 150 256 256 Z" transform="rotate(300 256 256) translate(0, -60)" fill="url(#petalGrad)" stroke="#191914" stroke-width="7" stroke-linejoin="round"/>

  <!-- Flower Center Core -->
  <circle cx="256" cy="256" r="42" fill="url(#centerGrad)" stroke="#191914" stroke-width="8"/>
  <circle cx="256" cy="256" r="26" fill="none" stroke="rgba(25, 25, 20, 0.2)" stroke-width="4" stroke-dasharray="6 4"/>
  <circle cx="256" cy="256" r="10" fill="#191914"/>
</svg>